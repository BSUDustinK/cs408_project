<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Character Tracker</title>
    <link rel="stylesheet" href="/stylesheets/cardstyle.css">
    
</head>
<body>
    <nav class="toolbar">
        <input type="file" id="char-upload" accept=".json" style="display:none"> <!--Uploaded Content-->

        <button class="tool-button btn-create-char">Create Character</button>
        <button class="tool-button btn-load-char">Load Character</button>
        <button class="tool-button btn-export-char">Save Character</button>
        <!-- <button class="tool-button btn-clear-char">Reset</button> -->
    </nav>
    
    <!-- Main Character Card -->
    <div id="character-app"></div>

    <!-- Modular Popup Interface -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h3 id="modal-title">Edit</h3>
            
            <div id="simple-input-group">
                <input type="text" id="modal-input">
            </div>

            <div id="hp-input-group">
                <input type="text" id="max-hp-input" >
                <input type="text" id="current-hp-input">
                <input type="text" id="tmp-hp-input">
            </div>

            <div id="create-edit-group"> <!--TODO implement character creation window-->
                <table>
                    <tr>
                        <td>Name</td>
                        <td><input type="text" id="name-input" ></td>
                    </tr>
                    <tr>
                        <td>Character Level</td> 
                        <td><input type="text" id="lvl-input" ></td>
                    </tr>
                    <tr>
                        <td>Hit Points</td>
                        <td><input type="text" id="hp-input" ></td>
                    </tr>
                    <tr>
                        <td>Armour Class</td>
                        <td><input type="text" id="ac-input" ></td>
                    </tr>
                </table>
                <hr>
                <table class="stat-table">
                    <tr>
                        <th>Stats</th>
                        <th>Proficient</th>
                        <th>Value</th>   
                    </tr>
                    <tr>
                        <td>Strength</td>
                        <td> <button id="str-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="str-input" ></td>
                    </tr>
                    <tr>
                        <td>Dexterity</td>
                        <td> <button id="dex-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="dex-input" ></td>
                    </tr>
                    <tr>
                        <td>Constitution</td>
                        <td> <button id="con-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="con-input" ></td>
                    </tr>
                    <tr>
                        <td>Intelligence</td>
                        <td> <button id="int-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="int-input" ></td>
                    </tr>
                    <tr>
                        <td>Wisdom</td>
                        <td> <button id="wis-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="wis-input" ></td>
                    </tr>
                    <tr>
                        <td>Charisma</td>
                        <td> <button id="cha-toggle" class="toggle-button" aria-pressed="false"></button> </td>
                        <td><input type="text" id="cha-input" ></td>
                    </tr>

                </table>
            </div>

            <div id="note-input-group" class="hidden">
                <textarea id="note-textarea" placeholder="Type your note here..."></textarea>
            </div>

            <div id="ability-input-group" class="hidden">
                <input type="text" id="ability-name-input" >
                <textarea id="ability-description-textarea" placeholder="Type your ability here..."></textarea>
            </div>

            <div class="modal-actions">
                <button id="btn-cancel" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button id="modal-save-btn" class="btn-save">Save</button>
            </div>
        </div>
    </div>

    <script src="/javascripts/characterloader.js"></script>
</body>
</html>
