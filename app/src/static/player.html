<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D Character Tracker</title>
    <link rel="stylesheet" href="/stylesheets/cardstyle.css">
    
</head>
<body>
    <nav class="toolbar">
        <input type="file" id="char-upload" accept=".json" style="display:none"> <!--Uploaded Content-->

        <button class="tool-button btn-create-char">Create Character</button>
        <button class="tool-button btn-load-char">Load Character</button>
        <button class="tool-button btn-export-char">Save Character</button>
        <!-- <button class="tool-button btn-clear-char">Reset</button> -->
    </nav>
    
    <!-- Main Character Card -->
    <div id="character-app"></div>

    <!-- Modular Popup Interface -->
    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h3 id="modal-title">Edit</h3>
            
            <div id="simple-input-group">
                <input type="text" id="modal-input">
            </div>

            <div id="note-input-group" class="hidden">
                <textarea id="note-textarea" placeholder="Type your note here..."></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button id="modal-save-btn" class="btn-save">Save</button>
            </div>
        </div>
    </div>

    <script src="/javascripts/characterloader.js"></script>
</body>
</html>
